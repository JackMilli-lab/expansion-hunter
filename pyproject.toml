[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expansion-hunter"
version = "0.1.0"
description = "Trading Cockpit — Expansion Hunter: causal crypto market scanner and decision engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "pydantic>=2.10,<3", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=15,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
desktop = ["pywebview>=6,<7", "pythonnet>=3,<4; sys_platform == 'win32'", "tzdata>=2025.1; sys_platform == 'win32'"]

[project.scripts]
expansion-hunter = "expansion_hunter.cli:main"
expansion-hunter-desktop = "expansion_hunter.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expansion_hunter = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
